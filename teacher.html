<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaking Practice · Teacher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.panel{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{border-radius:0;min-height:42px;background:transparent;color:var(--ink);font-size:15px;padding:8px 14px}
.seg button.on{background:var(--brand);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:6px 12px;font-size:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px}
.chip.on{border-color:var(--brand);background:var(--brand2);font-weight:700}
.list{display:grid;gap:12px}
.tk{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:6px}
.tk.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand2)}
.tkh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tkh b{font-size:18px}
.badge{font-size:13px;border-radius:999px;padding:2px 10px;background:var(--brand2);font-weight:500;white-space:nowrap}
.badge.l2{background:light-dark(#fde7d6,#4a2c14)}
.tkp{margin:0;color:var(--soft);font-size:15px}
.tk .words span{font-size:13px;padding:2px 10px}
.tkb{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.tkb button{min-height:40px;font-size:15px;padding:6px 14px}
.add{background:var(--brand);color:#fff;font-weight:700}
.tk.sel .add{background:var(--ok)}
.picked{display:grid;gap:8px;margin:10px 0}
.pk{display:flex;align-items:center;gap:8px;background:var(--brand2);border-radius:12px;padding:6px 8px 6px 12px}
.pk span{flex:1;font-size:15px}
.pk button{min-height:36px;min-width:36px;padding:4px 8px;background:var(--paper);color:var(--ink);font-size:14px}
.set{display:grid;gap:10px;margin:14px 0}
.tog{display:flex;align-items:center;gap:10px;font-weight:400;grid-template-columns:none}
.tog input{flex:none;width:22px;height:22px;accent-color:var(--brand)}
.linkbox{display:flex;gap:8px;flex-wrap:wrap}.linkbox input{flex:1 1 220px;font-size:14px}
.note{font-size:14px;color:var(--soft)}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:10}
.modal>.card{width:min(1000px,100%);max-height:calc(100vh - 32px);overflow:auto}
.empty{color:var(--soft);font-size:15px;padding:10px 0}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.panel{position:static;max-height:none}}
</style>
</head>
<body>
<header class="top"><h1>Speaking Practice · Teacher</h1><a href="index.html" style="color:#fff">Student page</a></header>
<main class="wrap">
 <div class="layout">
  <section>
   <h2>Choose tasks</h2>
   <p class="sub">Pick up to 12 tasks. Each task has a picture, a guide who gives content background, a model student, and a prompt with key words built in.</p>
   <div class="filters">
    <div class="seg" id="lv"><button data-v="1-2" class="on">WIDA 1–2</button><button data-v="3-4">WIDA 3–4</button><button data-v="all">All</button></div>
    <input id="q" type="search" placeholder="Search topics or words" aria-label="Search">
   </div>
   <div class="chips" id="areas" style="margin-bottom:16px"></div>
   <div class="list" id="list"></div>
  </section>
  <aside class="card panel">
   <h3>Your assignment</h3>
   <label>Assignment name<input id="nm" maxlength="80" placeholder="e.g. Unit 3 speaking practice"></label>
   <div class="picked" id="picked"></div>
   <div class="set">
    <label>Answer time<select id="tm"><option value="0">Each task's own time</option><option value="30">30 seconds</option><option value="45">45 seconds</option><option value="60">60 seconds</option><option value="90">90 seconds</option><option value="120">2 minutes</option></select></label>
    <label class="tog"><input type="checkbox" id="w" checked> Show key words on screen</label>
    <label class="tog"><input type="checkbox" id="c" checked> Show the spoken text on screen</label>
    <label class="tog"><input type="checkbox" id="r" checked> Students can re-record an answer</label>
    <label class="tog"><input type="checkbox" id="x" checked> Make a transcript (Chrome sends the audio to Google to do this)</label>
    <label class="tog"><input type="checkbox" id="f" checked> Show practice feedback after each answer (needs the transcript)</label>
   </div>
   <h3>Student link</h3>
   <div class="linkbox"><input id="link" readonly aria-label="Student link"><button class="primary" id="copy">Copy</button></div>
   <div class="dock" style="margin-top:10px"><a class="ghost" id="open" target="_blank" style="display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border-radius:14px;text-decoration:none;color:var(--ink)">Open as a student</a><button class="ghost" id="clear">Clear</button></div>
   <p class="note" id="lnote"></p>
  </aside>
 </div>
</main>
<div id="modal"></div>
<script src="tasks.js"></script>
<script src="pics.js"></script>
<script>
{
const BANK=window.BANK, BYID=Object.fromEntries(BANK.tasks.map(t=>[t.id,t]));
const AREAS=["Science","Social Studies","Mathematics","Language Arts","Social and Instructional"];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const store={get(){try{return JSON.parse(localStorage.getItem('sp-teacher')||'{}')}catch(e){return{}}},set(v){try{localStorage.setItem('sp-teacher',JSON.stringify(v))}catch(e){}}};
const saved=store.get();
let level=saved.level||'1-2', area=null, picked=(saved.picked||[]).filter(id=>BYID[id]);
['nm','tm','w','c','r','x','f'].forEach(k=>{ if(saved[k]!==undefined){ const el=$('#'+k); if(el.type==='checkbox') el.checked=saved[k]; else el.value=saved[k]; } });

function drawFilters(){
 document.querySelectorAll('#lv button').forEach(b=>b.classList.toggle('on',b.dataset.v===level));
 $('#areas').innerHTML=['All topics',...AREAS].map(a=>`<button class="chip ${((a==='All topics'&&!area)||a===area)?'on':''}" data-a="${esc(a)}">${esc(a)}</button>`).join('');
}
function shortPrompt(t){return t.you.replace(/^Now (it's your turn|you)\. /,'');}
function drawList(){
 const q=$('#q').value.trim().toLowerCase();
 const items=BANK.tasks.filter(t=>(level==='all'||t.level===level)&&(!area||t.area===area)&&(!q||[t.title,t.area,t.you,t.intro,...t.terms].join(' ').toLowerCase().includes(q)));
 $('#list').innerHTML=items.length?items.map(t=>{const sel=picked.includes(t.id);return `<article class="tk ${sel?'sel':''}"><div class="tkh"><b>${esc(t.title)}</b><span class="badge ${t.level==='3-4'?'l2':''}">WIDA ${t.level}</span><span class="badge">${esc(t.area)}</span><span class="note">${t.time}s · ${t.id}</span></div><p class="tkp">${esc(shortPrompt(t))}</p><div class="words">${t.terms.map(w=>`<span>${esc(w)}</span>`).join('')}</div><div class="tkb"><button class="add" data-add="${t.id}">${sel?'✓ Added':'+ Add'}</button><button class="ghost" data-pv="${t.id}">Preview</button></div></article>`}).join(''):'<p class="empty">No tasks match.</p>';
}
function drawPicked(){
 $('#picked').innerHTML=picked.length?picked.map((id,i)=>`<div class="pk"><span><b>${i+1}.</b> ${esc(BYID[id].title)} <span class="note">· WIDA ${BYID[id].level}</span></span><button data-up="${i}" aria-label="Move up" ${i===0?'disabled':''}>↑</button><button data-dn="${i}" aria-label="Move down" ${i===picked.length-1?'disabled':''}>↓</button><button data-rm="${i}" aria-label="Remove">✕</button></div>`).join('')+`<p class="note">${picked.length} of 12 tasks</p>`:'<p class="empty">No tasks yet. Click <b>+ Add</b> on a task.</p>';
 drawLink();
}
function drawLink(){
 const p=new URLSearchParams();
 if(picked.length) p.set('t',picked.join(','));
 const tm=$('#tm').value; if(tm!=='0') p.set('tm',tm);
 for(const k of ['w','c','r','x','f']) if(!$('#'+k).checked) p.set(k,'0');
 const nm=$('#nm').value.trim(); if(nm) p.set('n',nm);
 const base=location.href.replace(/[?#].*$/,'').replace(/[^/]*$/,'')+'index.html';
 const url=base+'?'+p.toString().replace(/%2C/g,',');
 $('#link').value=picked.length?url:'';
 $('#open').href=picked.length?url:'index.html';
 $('#copy').disabled=!picked.length;
 $('#lnote').innerHTML=location.protocol==='file:'?'This page is open from your computer, so this link only works on this computer. Put the files on GitHub Pages to get a link students can use.':'Paste this link into a Canvas assignment. Students open it in Chrome.';
 store.set({level,picked,nm:$('#nm').value,tm:$('#tm').value,w:$('#w').checked,c:$('#c').checked,r:$('#r').checked,x:$('#x').checked,f:$('#f').checked});
}
function toggle(id){ const i=picked.indexOf(id); if(i>=0) picked.splice(i,1); else { if(picked.length>=12){ alertBox('You can choose up to 12 tasks.'); return; } picked.push(id); } drawList(); drawPicked(); }
function alertBox(msg){ $('#lnote').textContent=msg; }

/* preview */
let segTimer=null;
function playSeg(id,holder){
 return new Promise(res=>{
  clearInterval(segTimer); if(holder.a) holder.a.pause();
  const sg=(BANK.seg&&BANK.seg[id])||[id,0,null];
  const a=new Audio('audio/'+sg[0]+'.mp3'); holder.a=a;
  let fin=false; const done=()=>{ if(fin) return; fin=true; clearInterval(segTimer); res(); };
  a.onended=done; a.onerror=done;
  const go=()=>{ try{ if(sg[1]) a.currentTime=sg[1]; }catch(e){}
   a.play().then(()=>{ if(sg[2]!=null){ segTimer=setInterval(()=>{ if(holder.a!==a){ clearInterval(segTimer); return; } if(a.currentTime>=sg[2]){ a.pause(); done(); } },40); } }).catch(done); };
  if(sg[1]){ if(a.readyState>=1) go(); else a.addEventListener('loadedmetadata',go,{once:true}); } else go();
 });
}
const PH={a:null};
let tok=0;
function preview(id){
 const t=BYID[id];
 const lines=[['guide',t.intro,'_i'],['guide',t.ask,'_a'],[t.who,t.model,'_m'],['guide',t.you,'_y']];
 const N={guide:'Guide',maya:'Maya',leo:'Leo'};
 $('#modal').innerHTML=`<div class="modal" id="mbg"><div class="card"><div class="tkh" style="justify-content:space-between"><h2 style="margin:0">${esc(t.title)}</h2><button class="ghost" id="mx">Close</button></div><p class="note">WIDA ${t.level} · ${esc(t.area)} · ${t.time} seconds to answer</p>
 <div class="stage" style="margin-top:12px"><div class="pic">${renderVis(t.vis)}</div><div><div class="talk">${lines.map((l,i)=>`<div class="line past"><div class="av ${l[0]}"><span>${N[l[0]][0]}</span></div><div class="bub"><small>${N[l[0]]} <button class="ghost" style="min-height:30px;padding:0 10px;font-size:13px;margin-left:6px" data-play="${id+l[2]}">▶ Play</button></small>${esc(l[1])}</div></div>`).join('')}</div>
 <div class="keyterms"><h4>Key words</h4><div class="words">${t.terms.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div>
 <div class="dock"><button class="primary" id="pall">▶ Play all</button><button class="${picked.includes(id)?'ghost':'primary'}" id="madd">${picked.includes(id)?'Remove from assignment':'+ Add to assignment'}</button></div></div></div></div></div>`;
 const close=()=>{ tok++; clearInterval(segTimer); if(PH.a) PH.a.pause(); $('#modal').innerHTML=''; };
 $('#mx').onclick=close; $('#mbg').onclick=e=>{ if(e.target.id==='mbg') close(); };
 $('#madd').onclick=()=>{ toggle(id); close(); };
 const play=src=>playSeg(src,PH);
 $('#modal').querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{tok++;play(b.dataset.play)});
 $('#pall').onclick=async()=>{ const my=++tok; for(const l of lines){ if(my!==tok) return; await play(id+l[2]); } };
 document.addEventListener('keydown',function k(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',k);} });
}

document.addEventListener('click',e=>{
 const b=e.target.closest('button'); if(!b) return;
 if(b.dataset.v){ level=b.dataset.v; drawFilters(); drawList(); drawLink(); }
 else if(b.dataset.a){ area=b.dataset.a==='All topics'?null:b.dataset.a; drawFilters(); drawList(); }
 else if(b.dataset.add) toggle(b.dataset.add);
 else if(b.dataset.pv) preview(b.dataset.pv);
 else if(b.dataset.up){ const i=+b.dataset.up; [picked[i-1],picked[i]]=[picked[i],picked[i-1]]; drawPicked(); }
 else if(b.dataset.dn){ const i=+b.dataset.dn; [picked[i+1],picked[i]]=[picked[i],picked[i+1]]; drawPicked(); }
 else if(b.dataset.rm){ picked.splice(+b.dataset.rm,1); drawList(); drawPicked(); }
});
$('#q').oninput=drawList;
['nm','tm','w','c','r','x','f'].forEach(k=>$('#'+k).addEventListener('input',drawLink));
$('#copy').onclick=async()=>{ const v=$('#link').value; try{ await navigator.clipboard.writeText(v); $('#copy').textContent='Copied!'; }catch(e){ $('#link').select(); document.execCommand('copy'); $('#copy').textContent='Copied!'; } setTimeout(()=>$('#copy').textContent='Copy',1500); };
$('#clear').onclick=()=>{ picked=[]; drawList(); drawPicked(); };
drawFilters(); drawList(); drawPicked();
}
</script>
</body>
</html>
